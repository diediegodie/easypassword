---
name: EasyPassword CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install ruff black pytest pytest-cov
      - run: ruff check .
      - run: black --check .
      - run: pytest

  integration:
    name: Integration Tests (Redis)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: src/backend
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      # Use localhost so the runner can reliably connect to the published port.
      REDIS_URL: redis://127.0.0.1:6379
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - name: Wait for Redis service
        run: |
          python - <<'PY'
          import socket,sys,time
          for i in range(30):
              try:
                  s=socket.create_connection(("127.0.0.1",6379),1)
                  s.close()
                  print("Redis available")
                  sys.exit(0)
              except Exception:
                  time.sleep(1)
          print("Timed out waiting for Redis")
          sys.exit(1)
          PY
      - run: pytest tests/integration -q
