[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easypassword-backend"
version = "1.0.0"
description = "EasyPassword - FastAPI backend"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
lint.select = ["E", "F", "B", "I"]
lint.ignore = []
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in argument defaults is the idiomatic pattern for DI
"app/modules/vault/router.py" = ["B008"]

[tool.pytest.ini_options]
minversion = "6.0"
# Exclude integration tests by default; CI integration job should run them explicitly
addopts = "-ra -q -m 'not integration'"
testpaths = ["tests"]
